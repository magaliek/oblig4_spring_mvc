<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="css/simple.css">
<title>Logg inn</title>
</head>
<body>
	<h2>Logg inn</h2>

    <p th:if="${feilmelding}" th:text="${feilmelding}" style="color: red"></p>

    <form method="post" th:action="@{/innlogging}">
        <fieldset>
            <label for="mobil">Mobil:</label>
            <input type="tel" name="mobil" id="mobil">
            <label for="passord">Passord:</label>
            <input type="password" name="passord" id="passord">
        </fieldset>
        <button type="submit">Logg inn</button>
    </form>

    <a th:href="@{/paameldingsskjema}">Gå til påmeldingsskjema</a>
</body>
</html>
