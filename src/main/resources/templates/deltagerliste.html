<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="css/simple.css">
	<title>Deltagerliste</title>
</head>
<body>
    <p th:object="${session.Innloggetbruker}" th:text="|Innlogget som: *{mobil} / *{fulltNavn}|"></p>

	<h2>Deltagerliste</h2>
	<table>
		<tr>
			<th>Kjønn</th>
			<th align="left">Navn</th>
			<th align="left">Mobil</th>
		</tr>

        <tr th:each="d : ${deltagere}" th:style="${Innloggetbruker.equals(d)} ? 'background-color: green'">
			<td th:utext="${d.kjonnsymbol}"></td>
			<td th:text="${d.fulltNavn}"></td>
			<td th:text="${d.mobilFormatert}"></td>
		</tr>

	</table>
	<br>

    <form method="post" th:action="@{/utlogging}">
		<button type="submit">
			Logg ut
		</button>
	</form>

</body>
</html>
